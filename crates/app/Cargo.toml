[package]
name = "pain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A cross-platform, multi-pane terminal emulator"

[dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", default-features = false }
config = { version = "1.8.0", path = "../config" }
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
env_logger = "0.11.11"
layout = { version = "1.8.0", path = "../layout" }
notify = "8.2.0"
pane = { version = "1.8.0", path = "../pane" }
# Only to decode the embedded window icon at startup (see `window_icon` in
# `main.rs`). Already in the dependency tree transitively, so declaring it
# directly adds nothing to the build — and it keeps `assets/pain-64.png`
# the single source of truth rather than committing a second, opaque raw
# pixel blob that would have to be regenerated by hand alongside it.
png = "0.18.1"
pollster = "1.0.1"
render = { version = "1.8.0", path = "../render" }
router = { version = "1.8.0", path = "../router" }
session = { version = "1.8.0", path = "../session" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Cross-platform "open this URL in the user's browser" — already in the
# tree via egui, so declaring it directly costs nothing and avoids
# hand-rolling xdg-open/open/start per platform.
webbrowser = "1.2.1"
wgpu = "29.0.4"
winit = "0.30.13"

# Console attachment only (`src/console.rs`) — this binary is built for the
# windows subsystem, so it has to opt back in to writing to the terminal it
# was launched from. Already in the dependency tree via winit/wgpu, so
# declaring it directly adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

# `cargo deb` reads this to build the .deb (see `cargo install cargo-deb`,
# then `cargo deb -p pain` from the workspace root). `depends` starts with
# `$auto` (cargo-deb's own `dpkg-shlibdeps`-based detection, which only
# catches libc/libgcc/libm — this binary's actual GUI dependencies aren't
# linked, they're loaded via `dlopen` at runtime by winit/wgpu/arboard, so
# `ldd` and anything built on it are blind to them) plus the runtime
# libraries confirmed by hand: `strings`-ing the built binary for the
# `.so` names it actually dlopen()s, then mapping each to its owning
# package via `dpkg -S` — not guessed from what winit/wgpu are generally
# known to need.
[package.metadata.deb]
maintainer = "Will Palmer <email.william.palmer@gmail.com>"
copyright = "2026, Will Palmer <email.william.palmer@gmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A cross-platform terminal emulator with a Terminator-style multi-pane UX \
(nested splits, drag-resize, pane grouping with broadcast input), built on \
Alacritty's VT/PTY backend with an original GPU-rendered frontend."""
section = "x11"
priority = "optional"
#
# `mesa-vulkan-drivers | vulkan-icd` is a hard dependency, not a
# recommendation. Without *some* Vulkan driver there is no adapter for wgpu
# to pick and the app cannot start at all, so `--no-install-recommends`
# (routine in containers and on minimal systems) would otherwise produce an
# install that only fails at launch. It's an alternation rather than a
# plain `mesa-vulkan-drivers` because Mesa's driver specifically isn't
# required — `vulkan-icd` is a virtual package the proprietary NVIDIA
# packages provide too, and forcing Mesa onto an NVIDIA-only machine
# installs drivers it will never load. Real package first so apt has an
# unambiguous default; a bare virtual package can't be depended on alone,
# since apt refuses to choose between providers. This mirrors what
# `libvulkan1` itself declares, only as a hard dependency.
depends = "$auto, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libegl1, libvulkan1, mesa-vulkan-drivers | vulkan-icd"

# A font is a recommendation, not a requirement, matching what every
# comparable package does — xterm, kitty and rxvt-unicode all depend on
# `libfontconfig1` (a library they link; this app doesn't use fontconfig
# at all, it scans the font directories directly) and none of them
# requires a font package. rxvt-unicode's `Recommends: fonts-dejavu` is
# the closest precedent and this follows it.
#
# It's here at all because the app really can't render without a font on
# disk — it aborts in the text shaper — and apt installs recommendations
# by default, so an ordinary install can't land in that state. Any machine
# with a graphical session already has fonts, which is why forcing one
# would be overreach.
recommends = "fonts-dejavu-core"
# The `.desktop` entry is what actually makes the app appear in a desktop
# environment's application menu — without it, an `apt install`ed terminal
# emulator can only be launched by typing its name into some *other*
# terminal, which is a poor first-run experience. Icons go in the standard
# `hicolor` theme paths (matched to `Icon=pain` in the desktop entry); the
# scalable SVG is included alongside the PNGs so themes that prefer vector
# icons can use it at any size.
assets = [
    ["target/release/pain", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/pain/README.md", "644"],
    # cargo-deb gzips anything under `usr/share/man/` itself, as Debian
    # policy requires, so this is listed uncompressed.
    ["../../man/pain.1", "usr/share/man/man1/pain.1", "644"],
    ["../../assets/pain.desktop", "usr/share/applications/", "644"],
    ["../../assets/pain.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/pain-16.png", "usr/share/icons/hicolor/16x16/apps/pain.png", "644"],
    ["../../assets/pain-24.png", "usr/share/icons/hicolor/24x24/apps/pain.png", "644"],
    ["../../assets/pain-32.png", "usr/share/icons/hicolor/32x32/apps/pain.png", "644"],
    ["../../assets/pain-48.png", "usr/share/icons/hicolor/48x48/apps/pain.png", "644"],
    ["../../assets/pain-64.png", "usr/share/icons/hicolor/64x64/apps/pain.png", "644"],
    ["../../assets/pain-128.png", "usr/share/icons/hicolor/128x128/apps/pain.png", "644"],
    ["../../assets/pain-256.png", "usr/share/icons/hicolor/256x256/apps/pain.png", "644"],
    ["../../assets/pain-512.png", "usr/share/icons/hicolor/512x512/apps/pain.png", "644"],
]

# `cargo generate-rpm` reads this to build the .rpm. Same payload as the
# .deb above, with Fedora's package names — the two families name almost
# every one of these libraries differently, and the mapping is hand-checked
# against a real Fedora image (see `Containerfile`'s `test-rpm` stage,
# which installs the built package and starts the app for real).
#
# `auto-req = "builtin"` uses cargo-generate-rpm's own ELF scanner rather
# than shelling out to rpm's `find-requires`, which means the .rpm can be
# built on a Debian-family host with no rpm-build tooling at all — the
# whole reason one container can produce both packages. It picks up the
# libc/libgcc/libm links and their glibc symbol versions; everything below
# is dlopen'd at runtime and invisible to any scanner, so it's listed by
# hand exactly as in the .deb.
[package.metadata.generate-rpm]
auto-req = "builtin"
assets = [
    { source = "target/release/pain", dest = "/usr/bin/pain", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/pain/README.md", mode = "644", doc = true },
    { source = "../../man/pain.1", dest = "/usr/share/man/man1/pain.1", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/pain/LICENSE", mode = "644", doc = true },
    { source = "../../assets/pain.desktop", dest = "/usr/share/applications/pain.desktop", mode = "644" },
    { source = "../../assets/pain.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pain.svg", mode = "644" },
    { source = "../../assets/pain-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/pain.png", mode = "644" },
    { source = "../../assets/pain-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/pain.png", mode = "644" },
]

# `mesa-vulkan-drivers` is required outright here, where the .deb gets to
# offer an alternation. Fedora has no `vulkan-icd`-style virtual package to
# depend on instead — checked directly against a Fedora image, where that
# package provides only itself and its sonames, and nothing at all provides
# a generic vulkan-driver capability. Naming Mesa's driver outright is a
# far smaller imposition here than the same thing would be on Debian:
# Fedora Workstation installs it by default, it carries the software
# fallback driver, and it coexists with the out-of-tree NVIDIA packages
# rather than conflicting with them.
[package.metadata.generate-rpm.requires]
mesa-vulkan-drivers = "*"
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
libwayland-egl = "*"
libglvnd-egl = "*"
vulkan-loader = "*"

# See the .deb's `recommends` above for why a font is recommended rather
# than required. dnf installs weak dependencies by default too.
[package.metadata.generate-rpm.recommends]
dejavu-sans-mono-fonts = "*"
